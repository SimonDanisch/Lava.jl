name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: write
  contents: read

jobs:
  test:
    name: Julia ${{ matrix.julia-version }} - Lavapipe
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1']
    steps:
      - uses: actions/checkout@v4
      - uses: serenity4/julia-lavapipe@v1
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - name: Install X11 dependencies for GLFW
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev mesa-utils xvfb libgl1 libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev
      - uses: julia-actions/julia-buildpkg@v1
      - name: Run tests under xvfb
        # CI mode = fast subset + the full Tier 4 GPUArrays correctness suite
        # (~7.5k assertions), the bulk of real coverage. The only group that
        # *crashes the process* on GitHub's lavapipe (Mesa/LLVM 20 on the Azure
        # CPU) is `indexing find` — an EXCEPTION_ACCESS_VIOLATION in the software
        # rasterizer's JIT, NOT a Lava correctness bug (RADV runs it fine, and it
        # is not reproducible on local lavapipe LLVM 22 or a CI-exact container).
        # A SIGSEGV can't be caught, so that one group is skipped on llvmpipe via
        # test_gpuarrays.jl's LAVAPIPE_CRASH_SKIP; everything else runs. The
        # RADV-only stress / per-vendor tiers stay out of CI (run locally / on a
        # self-hosted real-GPU runner).
        run: |
          DISPLAY=:0 xvfb-run -s '-screen 0 1024x768x24' julia --color=yes --project -e 'using Pkg; Pkg.test("Lava"; test_args=["ci"])'
