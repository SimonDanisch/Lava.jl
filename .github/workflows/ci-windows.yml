name: CI (Windows)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: write
  contents: read

jobs:
  test-windows:
    name: Julia ${{ matrix.julia-version }} - Lavapipe (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        julia-version: ['1']
    env:
      # Run the ~2-3 min subset on Windows.  The full GPUArrays suite +
      # HW-TLAS stress runs on Linux CI; here we just want to catch
      # Windows-specific path / DLL / GLFW regressions.
      LAVA_FAST: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install Mesa lavapipe (Windows)
        shell: pwsh
        run: |
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/25.2.0/mesa3d-25.2.0-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile mesa.7z
          7z x mesa.7z -omesa
          $icd = (Resolve-Path "mesa\x64\lvp_icd.x86_64.json").Path
          $dir = (Resolve-Path "mesa\x64").Path
          Write-Host "ICD JSON : $icd"

          # IMPORTANT: GitHub `windows-latest` runners execute with an ELEVATED
          # (admin) token.  The Vulkan loader, by design, IGNORES all VK_*
          # environment variables (VK_DRIVER_FILES / VK_ICD_FILENAMES / …) when
          # the process is elevated — a privilege-escalation guard against
          # untrusted ICD paths.  So pointing at the ICD via env vars silently
          # fails and the loader falls back to the registry → "Found no drivers".
          #
          # The fix is to register the ICD where the elevated loader DOES look:
          # HKLM\SOFTWARE\Khronos\Vulkan\Drivers, a DWORD named with the full
          # path to the ICD JSON, value 0 (0 = enabled).
          New-Item -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" `
            -Name $icd -Value 0 -PropertyType DWORD -Force | Out-Null
          Write-Host "Registered ICD in HKLM\SOFTWARE\Khronos\Vulkan\Drivers"

          # The ICD JSON's library_path is relative (".\vulkan_lvp.dll"), so the
          # DLL + its deps must be discoverable — put the mesa dir on PATH.
          "$dir" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Verify Vulkan driver visible
        shell: pwsh
        run: |
          # vulkaninfo ships in the mesa archive; confirm the loader now sees
          # lavapipe before we spend time building Julia.
          $vk = Join-Path (Resolve-Path "mesa\x64").Path "vulkaninfo.exe"
          if (Test-Path $vk) {
            & $vk --summary 2>&1 | Select-String -Pattern "deviceName|driverName|llvmpipe"
          } else {
            Write-Host "vulkaninfo.exe not in archive; skipping summary"
          }

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1

      - name: Run fast-mode tests
        run: julia --color=yes --project -e 'using Pkg; Pkg.test("Lava"; test_args=["fast"])'
