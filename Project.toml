name = "Lava"
uuid = "3a680b1f-cb25-4bee-9cf7-bc880b76dc8c"
authors = ["Simon Danisch and contributors"]
version = "0.1.0"

[deps]
Adapt = "79e6a3ab-5dfb-504d-930d-738a2a938a0e"
Atomix = "a9b6321e-bd34-4604-b9c9-b65b8de01458"
GPUArrays = "0c68f7d7-f131-5f86-a1c3-88cf8149b2d7"
GPUCompiler = "61eb1bfa-7361-4325-ad38-22787b887f55"
GeometryBasics = "5c1252a2-5f33-56bf-86c9-59e7332b4326"
KernelAbstractions = "63c18a36-062a-441e-b654-da1e3ab1ce7c"
KernelInterface = "4ee993da-d684-4d17-a7dd-4e58e78d92bf"
LLVM = "929cbde3-209d-540e-8aea-75f648917ca0"
PrecompileTools = "aea7be01-6a6a-4083-8856-8a6e6704d82a"
SPIRV_Tools_jll = "6ac6d60f-d740-5983-97d7-a4482c0689f4"
Serialization = "9e88b42a-f829-5b0c-bbe9-9e923198166b"
StaticArrays = "90137ffa-7385-5640-81b9-e52037218182"
UnsafeAtomics = "013be700-e6cd-48c3-b4a1-df204f14c38f"
# Only `Vulkan.HAS_LOADER` is used: the compiler is built where a Vulkan loader exists.
Vulkan = "9f14b124-c50e-4008-a7d4-969b3a6cd68a"

[weakdeps]
BFloat16s = "ab4f0b2a-ad5b-11e8-123f-65d77653426b"
Metal = "dde4c033-4e86-420c-a63e-0dd931031962"

[extensions]
LavaMetalExt = ["Metal", "BFloat16s"]

[compat]
# Lava extends GPUCompiler internals (`finish_ir!`, `validate_ir`, the method table
# and caching hooks), which change between minor releases; LLVM.jl 10 changed type
# accessors. The lower bounds are the releases the suite passes on.
GPUCompiler = "2.22"
LLVM = "10.4"
# Lava overrides KernelInterface's `localmemory(T, Val(dims))`, which KernelAbstractions'
# `@localmem` lowers to, and `sub_group_reduce(+, x)`.
KernelInterface = "0.4.6"
KernelAbstractions = "0.10.7"
# `spirv-opt` and `spirv-val`. The emitter works around `spirv-opt` folding
# `OpConvertSToF` of a constant by the operand type's signedness.
SPIRV_Tools_jll = "2025.4"
Adapt = "4"
Atomix = "1.5"
BFloat16s = "0.5, 0.6"
GPUArrays = "12"
GeometryBasics = "0.5"
# `@device_override`, `method_table` and `@device_function` are public from the
# release with JuliaGPU/Metal.jl#1169.
Metal = "1.12"
PrecompileTools = "1"
Serialization = "1"
StaticArrays = "1.9.17"
UnsafeAtomics = "0.4"
Vulkan = "0.7"
julia = "1.12"

[extras]
Logging = "56ddb016-857b-54e1-b83d-db4d58db5568"
Random = "9a3f8284-a2c9-5f02-9a11-845980a1fd5c"
Test = "8dfed614-e22c-5e08-85e1-65c5234f0b40"

[targets]
test = ["Logging", "Random", "Test"]
