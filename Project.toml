[sources]
Raycore = {url = "https://github.com/JuliaGeometry/Raycore.jl", rev = "master"}

[compat]
# Lava depends on a few GPUCompiler internals (rm_trap! was one, now vendored;
# kernel_state_type, methodinstance, method_table, cached_compilation remain).
# GPUCompiler removes/renames internals across PATCH releases (1.13.1 → 1.13.3
# dropped rm_trap!), so this stays inside the 1.x line and gets bumped only after
# testing. Validated on 1.23.0: no source changes needed, kernels bit-identical,
# and ~20% faster end-to-end than 1.13.3.
#
# Do NOT widen this to 2: the whole CUDA 6.x line requires GPUCompiler 1.x, and
# allowing 2 makes Lava and CUDA.jl mutually unsatisfiable in one project.
GPUCompiler = "1"
SPIRV_LLVM_Backend_jll = "21.1.4"
StaticArrays = "1.9.17"
julia = "1.12"

